name: Mise à jour de la prévision

on:
  schedule:
    # toutes les heures (à h+10) ; GitHub peut décaler de quelques minutes
    - cron: "10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["build_site.py", "prevision_frontenac.py", "docs/index.html", ".github/workflows/update.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Télécharger les données et calculer la prévision
        run: python build_site.py
      - name: Publier
        run: |
          git config user.name "robot-prevision"
          git config user.email "robot@users.noreply.github.com"
          git add docs/data.json docs/history.csv docs/spine_archive.csv docs/forecast_archive.csv
          git diff --cached --quiet || git commit -m "Prévision du $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
