name: Mise à jour de la prévision

on:
  schedule:
    # toutes les heures (à h+10) ; GitHub peut décaler de quelques minutes
    - cron: "23 * * * *"
    - cron: "53 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["build_site.py", "prevision_frontenac.py", "docs/index.html", ".github/workflows/update.yml"]

permissions:
  contents: write

# une seule mise à jour à la fois : deux passages simultanés se marcheraient dessus
concurrency:
  group: mise-a-jour
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Télécharger les données et calculer la prévision
        run: python build_site.py
      - name: Publier
        run: |
          git config user.name "robot-prevision"
          git config user.email "robot@users.noreply.github.com"
          git add docs/*.json docs/*.csv
          git diff --cached --quiet || git commit -m "Prévision du $(date -u +'%Y-%m-%d %H:%M UTC')"
          # si le dépôt a reçu un commit pendant le calcul (mise en ligne d'une page, par exemple),
          # on replace les données par-dessus et on renvoie, jusqu'à trois fois
          for essai in 1 2 3; do
            git push && exit 0
            echo "envoi refusé (essai $essai) : on récupère la dernière version du dépôt"
            git pull --rebase --autostash origin main || { git rebase --abort; exit 1; }
          done
          exit 1
