<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- La vague sur l'échelle : le trait du niveau part d'une graduation et se soulève en vague stationnaire.
       À plat, sans dégradé. Gris froids du site ; l'orangé marque ce qui est prévu, à la hauteur de la crête. -->
  <rect width="512" height="512" rx="112" fill="#111315"/>
  <!-- échelle : montant, graduations longues en haut et en bas, courtes entre les deux -->
  <rect x="116" y="96" width="20" height="320" fill="#5d636b"/>
  <rect x="136" y="96" width="64" height="20" fill="#a4a9b0"/>
  <rect x="136" y="156" width="36" height="20" fill="#5d636b"/>
  <rect x="136" y="216" width="36" height="20" fill="#5d636b"/>
  <rect x="136" y="276" width="36" height="20" fill="#5d636b"/>
  <rect x="136" y="396" width="64" height="20" fill="#a4a9b0"/>
  <!-- niveau et vague -->
  <path d="M136 346H208C266 346 276 196 338 196C390 196 400 286 444 286" fill="none" stroke="#eceef0" stroke-width="28" stroke-linecap="round"/>
  <!-- repère du niveau prévu -->
  <rect x="52" y="186" width="64" height="20" fill="#f5a04e"/>
</svg>
